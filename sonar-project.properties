# Organización y projectKey se proporcionan con variables de GitHub Actions.
sonar.projectName=Green World Backend
sonar.host.url=https://sonarcloud.io
sonar.sources=src
sonar.tests=tests/unit
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=reports/coverage/lcov.info
sonar.exclusions=node_modules/**,reports/**,tests/postman/**
